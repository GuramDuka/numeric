      numeric_demo_avx2:
        Compiles src/main.cpp with -mavx2 -DNN_HAVE_AVX2
        Links against numeric-lib
        target_compile_features(cxx_std_23)

      Add a CMake check (check_cxx_source_compiles) that verifies the
      compiler accepts -mavx2 before adding the avx2 target, and similarly
