  # ═════════════════════════════════════════════════════════════════════════
  # TASK 4: Review SIMD implementation
  # ═════════════════════════════════════════════════════════════════════════
  - id: review_simd
    title: "Review SIMD add/sub loops for correctness and safety"
    description: >-
      Review the SIMD-accelerated add/sub loop changes in id.hpp for
      correctness, carry/borrow propagation soundness, and edge-case safety.
      Verify that the vectorized + scalar carry resolution pattern produces
      bit-identical results for all possible input lengths and sign
      combinations.

      Check:
      - Carry detection logic: after _mm256_add_epi64, compare result < a
        (unsigned comparison) yields per-lane carry. Is the carry vector
        correctly OR-shifted into the next chunk?
      - Borrow detection for subtraction: result > a (unsigned) yields per-lane
        borrow.
      - Scalar fixup pass correctly handles cascading carries (a carry from
        a fixup can itself produce another carry — ensure loop terminates).
      - Edge case: array length < SIMD vector width — falls through to scalar.
      - Edge case: array length not a multiple of vector width — partial
        final SIMD chunk not attempted.
      - No undefined behavior: unaligned loads/stores, no out-of-bounds reads.
      - NN_HAVE_AVX2 and NN_HAVE_AVX guards are exclusive and correct.
    wave: 3
    agent: gem-reviewer
    status: completed

    # Context
    covers:
      - "Correctness of SIMD carry/borrow detection and propagation"
      - "Edge case coverage (short arrays, uneven lengths, sign combinations)"
      - "Memory safety (unaligned load/store, bounds checking)"
      - "Bit-identical result guarantee"
      - "Compile-time guard correctness"
    dependencies:
      - build_update_baseline
    context_files:
      - path: src/id.hpp
        description: "Modified add/sub hot loops — review the SIMD guard sections"

    # Quality gates
    acceptance_criteria:
      - "All edge cases covered: zero-length, 1-word, 3-word, 4-word, 5-word, 1000-word arrays"
      - "Carry chain across SIMD chunks correctly propagates without losing bits"
      - "Borrow chain across SIMD chunks correctly propagates (subtraction)"
      - "No unaligned loads that could crash on ARM or pre-SSE3 CPUs (but x86_64 immintrin.h handles unaligned)"
      - "AVX path (128-bit) and AVX2 path (256-bit) are mutually exclusive"

    # Verification
    success_criteria:
      - "Review finds no correctness defects"
      - "All acceptance criteria verified"

    # Agent-specific handoff
    requires_review: true
    review_depth: full
    review_security_sensitive: false
