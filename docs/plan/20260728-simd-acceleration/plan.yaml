      - "cmake --build build --target numeric_demo_avx2 succeeds"
      - "cmake --build build --target numeric_demo succeeds (scalar, unchanged)"
      - "benchmark_baseline.json remains valid (no corruption from CMake step)"

    # Handoff
    handoff:
      do_not_reinvestigate:
        - "Existing numeric_demo target pattern at CMakeLists.txt:35-38"
        - "CMake find_package(Threads) already present — no threading change needed"
      minimal_change: >-
        Add two new target blocks after the existing numeric_demo target.
        Wrap in if(NUMERIC_BUILD_MAIN) block. Add include(CheckCXXSourceCompiles)
