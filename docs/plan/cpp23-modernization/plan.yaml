plan_id: cpp23-modernization
objective: "Modernize header-only C++ arbitrary-precision arithmetic library (Numeric) from C++17 to C++23: apply C++23 language features, fix code problems (C-casts, union type-punning, NULL→nullptr, typedef→using, div() shadowing), add academic commentary (Knuth refs, complexity notes, algorithm descriptions, pre/post conditions) to every function. Must preserve semantics and pass all existing tests."
created_at: "2026-07-11T00:00:00Z"
created_by: "gem-planner"
status: pending
tldr: >
  Rewrite 10 files across 6 waves: CMake→C++23, then bottom-up through the
  include DAG (tlsf→id→wk→ii→nn→main/tests), then build_verify. Each source
  file gets: (1) C++23 mechanical changes, (2) code problem fixes, (3) academic
  commentary blocks. Test files get minimal style updates. Build_verify compiles
  and runs test_integer + test_numeric with ctest.

# ═══════════════════════════════════════════════════════════════════════════
# PLAN-LEVEL METRICS
# ═══════════════════════════════════════════════════════════════════════════
plan_metrics:
  wave_1_task_count: 4
  total_dependencies: 15
  risk_score: high
quality_warnings:
  - "Newton fraction blowup in nn.hpp root() — must keep iter≤12 guard, do not alter existing guard logic"
  - "Header-only globals (nn_izero etc.) — linker errors if multi-TU. All source remains header-only; tests are separate CMake targets."
  - "div() method on integer shadows std::div — rename to divide() to avoid ADL ambiguity"
  - "Union type-punning in id.hpp isal/isar shared with dword* aliasing — must migrate to std::bit_cast without breaking shift semantics"

# ═══════════════════════════════════════════════════════════════════════════
# PLANNING ANALYSIS (HIGH complexity)
# ═══════════════════════════════════════════════════════════════════════════
open_questions:
  - question: "Should integer::div() be renamed to divide() to avoid std::div shadowing, or is internal use safe?"
    context: "integer::div(divider, &mod) shadows std::div from <cstdlib>. All call sites are internal (ii.hpp, nn.hpp). Renaming is safer but touches ~10 call sites."
    type: decision_blocker
    affects: ["ii", "nn", "test_integer"]
  - question: "How aggressive should std::bit_cast migration be in id.hpp isal/isar?"
    context: "isal() and isar() use union { word* w; dword* d; } for aliasing. std::bit_cast requires same size — word* vs dword* are different pointer sizes on some archs. May need reinterpret_cast instead."
    type: decision_blocker
    affects: ["id"]
  - question: "Should cout<< in main.cpp be replaced with std::print/println?"
    context: "std::print is C++23 but g++ 14.3.1 supports it via <print>. Replacing all << chains would be a large diff. May limit to new code paths only."
    type: decision_blocker
    affects: ["main"]
assumptions:
  - "g++ 14.3.1 fully supports C++23 with -std=c++23 (verified via AGENTS.md build notes)"
  - "All existing tests pass after each atomic file rewrite (no cross-file breakage expected from mechanical changes)"
  - "Academic commentary adds no behavioral change — pure documentation blocks and inline comments"
  - "Thread pool busy-wait pattern: current implementation uses condition_variable correctly; only the 'runs_' polling in wait() is minor busy-wait — acceptable for this scope"
  - "constexpr allocator not required — TLSF uses runtime mmap/malloc; marking constexpr would force compile-time evaluation which is infeasible"

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "C++23 std::print breaks on older g++ < 14 or non-Linux platforms"
      likelihood: medium
      impact: high
      mitigation: "Conditionally guard std::print with __has_include(<print>); fallback to cout"
    - scenario: "std::bit_cast of pointer unions in id.hpp causes undefined behavior or miscompilation"
      likelihood: medium
      impact: critical
      mitigation: "Prefer memcpy-based type punning (std::bit_cast on trivially copyable) or reinterpret_cast where bit_cast is invalid; test shift operations with known values"
    - scenario: "Renaming div() to divide() breaks a call site and test fails"
      likelihood: low
      impact: medium
      mitigation: "Comprehensive grep for all div() calls before rename; build_verify catches failures"
    - scenario: "Normalize(3) semantics broken by modernization — trailing-zero trim or GCD path altered"
      likelihood: low
      impact: critical
      mitigation: "Keep normalize() logic identical; only add commentary. Verify with existing gcd/lcm tests."
    - scenario: "Academic commentary bloats headers past compiler limits"
      likelihood: low
      impact: low
      mitigation: "Keep commentary concise; compiler limits are far beyond these file sizes"

coordination_notes:
  - "WAVE ORDER: cmake→tlsf→id∥wk→ii→nn→main∥tests→build_verify. Strict include-DAG order."
  - "Academic commentary is additive only — do not rewrite algorithms, only explain them."
  - "C-cast migration: use static_cast for arithmetic casts, reinterpret_cast for pointer casts, const_cast only where necessary. Never use C-style (type)expr."
  - "NULL→nullptr: every occurrence across all files. Use grep to find them all."
  - "typedef struct X → struct X + using X = ... pattern. Do NOT break C-compatible layout."
  - "Keep #pragma GCC push_options/pop_options around isal/isar in id.hpp — these are performance-critical."
  - "test_integer and test_numeric: minimal changes — only C++23 style if it doesn't break the TEST macro."

contracts:
  - from_task: "tlsf"
    to_task: "id"
    interface: "tlsf::TLSF_Impl (singleton allocator with malloc/realloc/free)"
    format: "Header-only; id.hpp #includes tlsf.hpp. TLSF_Impl API unchanged — only internal implementation modernized."
  - from_task: "id"
    to_task: "ii"
    interface: "nn_integer_data class (ref-counted bigint core), nn_integer typedef, nn_new/nn_init_* helpers"
    format: "Header-only; ii.hpp #includes id.hpp. nn_integer_data method signatures unchanged."
  - from_task: "wk"
    to_task: "ii"
    interface: "ThreadPoolT<void()> aka ThreadPool — global instance 'pool' in ii.hpp"
    format: "Header-only; ii.hpp #includes wk.hpp. ThreadPoolT API (run_task/wait) unchanged."
  - from_task: "ii"
    to_task: "nn"
    interface: "integer class — all arithmetic/bitwise/string ops, gcd, pow, factorial"
    format: "Header-only; nn.hpp #includes ii.hpp. integer method signatures unchanged."
  - from_task: "nn"
    to_task: "main"
    interface: "numeric class + pi() function — all math ops, trig, root, pi computation"
    format: "Header-only; main.cpp #includes nn.hpp. numeric API unchanged."
  - from_task: "nn"
    to_task: "test_integer"
    interface: "integer class + TEST macro infrastructure"
    format: "test_integer.cpp includes nn.hpp (which includes ii.hpp). All integer tests must pass identically."
  - from_task: "nn"
    to_task: "test_numeric"
    interface: "numeric class + TEST_CLOSE macro"
    format: "test_numeric.cpp includes nn.hpp. All numeric tests must pass identically."

